name: terraform

on:
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra/

  plan:
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: init
        id: init
        run: terraform init -backend=false -no-color

      - name: validate
        id: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false -refresh=false \
            -out=tfplan 2>&1 | tee plan.txt

      # Plan in the workflow output.
      - name: step summary
        if: always()
        run: |
          {
            echo "## terraform plan - ${{ matrix.environment }}"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Plan as a downloadable artifact.
      - name: upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            infra/envs/${{ matrix.environment }}/plan.txt
            infra/envs/${{ matrix.environment }}/tfplan
          retention-days: 14

      # Plan as a PR comment. Finds its own previous comment by the hidden
      # marker and edits it, so pushing again does not add another one.
      - name: comment plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- tf-plan-${env} -->`;

            let plan = '';
            try {
              plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');
            } catch (e) {
              plan = `no plan output: ${e.message}`;
            }

            // Comments are capped at 65536 characters. Keep the end, where the
            // summary and any errors are.
            let note = '';
            if (plan.length > 55000) {
              plan = plan.slice(plan.length - 55000);
              note = `\nPlan truncated, full output is in the tfplan-${env} artifact.\n`;
            }

            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['n/a'])[0];

            const body = [
              marker,
              `### terraform plan - \`${env}\` (${process.env.PLAN_OUTCOME})`,
              '',
              summary,
              note,
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
